name: Flutter member app

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-member-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: apps/member_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify committed native runner configuration
        run: |
          node ../../scripts/configure-flutter-platforms.mjs .
          git diff --exit-code -- android ios

      - name: Verify generated API contracts are synchronized
        run: |
          cmp ../../docs/contracts/soul_v1_api.dart lib/src/generated/soul_v1_api.dart
          cmp ../../docs/contracts/soul_v1_models.dart lib/src/generated/soul_v1_models.dart

      - name: Materialize owner-provided onboarding assets
        run: |
          rm -rf assets/uploaded_onboarding
          mkdir -p assets/uploaded_onboarding
          unzip -q .prototype_assets/uploaded_onboarding_assets.zip -d assets/uploaded_onboarding

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze member app
        run: flutter analyze

      - name: Run member app tests
        run: flutter test

      - name: Build Android debug artifact
        run: flutter build apk --debug --dart-define=SOUL_PROTOTYPE_MODE=true --dart-define=SOUL_API_ORIGIN=https://api.invalid

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soul-onboarding-preview-apk
          path: apps/member_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/member_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify committed native runner configuration
        run: |
          node ../../scripts/configure-flutter-platforms.mjs .
          git diff --exit-code -- android ios

      - name: Materialize owner-provided onboarding assets
        run: |
          rm -rf assets/uploaded_onboarding
          mkdir -p assets/uploaded_onboarding
          unzip -q .prototype_assets/uploaded_onboarding_assets.zip -d assets/uploaded_onboarding

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS simulator artifact
        run: flutter build ios --simulator --debug --dart-define=SOUL_PROTOTYPE_MODE=true --dart-define=SOUL_API_ORIGIN=https://api.invalid
