name: Flutter member app

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-member-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/member_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS runner projects
        run: |
          flutter create --platforms=android,ios --org com.soul .
          node ../../scripts/configure-flutter-platforms.mjs .

      - name: Verify generated API contracts are synchronized
        run: |
          cmp ../../docs/contracts/soul_v1_api.dart lib/src/generated/soul_v1_api.dart
          cmp ../../docs/contracts/soul_v1_models.dart lib/src/generated/soul_v1_models.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze member app
        run: flutter analyze

      - name: Run member app tests
        run: flutter test

      - name: Build Android debug artifact
        run: flutter build apk --debug --dart-define=SOUL_API_ORIGIN=https://api.invalid
