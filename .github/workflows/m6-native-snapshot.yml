name: Generate Flutter native runners

on:
  push:
    branches:
      - codex/mobile-m6-native-release

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout M6 branch
        uses: actions/checkout@v5
        with:
          ref: codex/mobile-m6-native-release

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native runner projects from the pinned Flutter toolchain
        working-directory: apps/member_app
        run: |
          flutter create --platforms=android,ios --org com.soul .
          node ../../scripts/configure-flutter-platforms.mjs .

      - name: Commit generated runner projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/member_app/android apps/member_app/ios
          if git diff --cached --quiet; then
            echo "Native runners already match the Flutter template."
            exit 0
          fi
          git commit -m "Commit Flutter native runner projects"
          git push origin HEAD:codex/mobile-m6-native-release
