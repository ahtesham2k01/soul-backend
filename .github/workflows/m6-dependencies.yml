name: Pin M6 Flutter dependencies

on:
  push:
    branches:
      - codex/mobile-m6-native-release

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/mobile-m6-native-release

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve native release dependencies
        working-directory: apps/member_app
        run: |
          flutter pub add firebase_core firebase_messaging in_app_purchase

      - name: Commit resolved pubspec and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/member_app/pubspec.yaml apps/member_app/pubspec.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Pin M6 native Flutter dependencies"
          git push origin HEAD:codex/mobile-m6-native-release
