name: Pin welcome SVG dependency
on:
  push:
    branches:
      - codex/welcome-figma-alignment
permissions:
  contents: write
jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/welcome-figma-alignment
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/member_app
        run: flutter pub get
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/member_app/pubspec.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Pin Flutter SVG dependency"
          git push origin HEAD:codex/welcome-figma-alignment
