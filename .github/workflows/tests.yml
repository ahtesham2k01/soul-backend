name: Laravel tests

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: laravel-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build admin frontend
        run: |
          npm ci
          npm run contracts:generate
          git diff --exit-code -- docs/contracts
          npm run contracts:test
          npm run localization:audit
          npm run localization:test
          npm run build

      - name: Analyze generated Flutter contracts
        run: |
          dart analyze docs/contracts/soul_v1_api.dart
          dart analyze docs/contracts/soul_v1_models.dart

      - name: Audit locked production dependencies
        run: |
          composer audit --locked
          npm audit --omit=dev --audit-level=high

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate application configuration
        run: |
          php artisan soul:config-check
          node scripts/load-api-smoke.mjs --help

      - name: Run test suite
        run: php artisan test
